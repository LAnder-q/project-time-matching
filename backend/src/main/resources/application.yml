server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pm_tool?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.pmtool: debug

# JWT 配置
jwt:
  secret: pm-tool-secret-key-2026-for-hs256-algorithm-must-be-long-enough
  # token 有效期：24小时（毫秒）
  expiration: 86400000

# 数据加密配置（AES 对称加密，用于敏感字段加密存储）
data:
  encrypt:
    key: pm-tool-data-encrypt-key-2026
