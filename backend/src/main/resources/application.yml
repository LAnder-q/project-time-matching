server:
  port: 8080
  servlet:
    context-path: /api

# 应用版本：构建时由 Maven 从 pom.xml 自动注入，不要手动修改
app:
  version: @project.version@

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pm_tool?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    # 数据库账号：优先读取环境变量 PM_DB_USER / PM_DB_PASS，未设置时使用默认值
    username: ${PM_DB_USER:root}
    password: ${PM_DB_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Flyway：启动时自动检测并执行未应用的数据库迁移脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.pmtool: debug

# JWT 配置
jwt:
  secret: pm-tool-secret-key-2026-for-hs256-algorithm-must-be-long-enough
  # token 有效期：24小时（毫秒）
  expiration: 86400000

# 数据加密配置（AES 对称加密，用于敏感字段加密存储）
data:
  encrypt:
    key: pm-tool-data-encrypt-key-2026
